# Revised protocol v1.0, decided after reviewing original E1-E4 test scores.
# Do not present revised test results as an independent, untouched hold-out assessment.
schema_version: 1
experiment_status: posthoc_revised_primary_candidate
original_config: configs/experiments.yaml
seed: 42
stages:
  head_only:
    epochs: 5
    learning_rate: 0.001
  partial_fine_tune:
    epochs:
      pakistan: 40
      stanford_cars: 40
    peak_learning_rate: 0.00003
    minimum_learning_rate: 0.000001
    warmup_epochs: 2
    warmup_start_fraction: 0.1
    schedule: linear_warmup_cosine_by_epoch
    early_stopping_patience: 10
optimizer: AdamW
weight_decay: 0.01
checkpoint_selection: validation_macro_f1
precision: cuda_amp_fp16
init: timm_imagenet_pretrained_new_classifier
image_pipeline: reuse_configs_experiments_yaml
batch_size: reuse_configs_experiments_yaml
freeze: reuse_src_vehicle_models_py
no_test_data_during_training: true
posthoc_test_caveat: original_holdout_results_already_inspected_before_this_recipe
